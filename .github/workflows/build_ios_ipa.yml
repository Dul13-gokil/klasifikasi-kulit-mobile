name: Build iOS IPA (Unsigned for Sideloadly / AltStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build_ios:
    name: Build Flutter iOS IPA on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Klasifikasi_Kulit_Wajah_iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klasifikasi_Kulit_Wajah_iOS_IPA
          path: Klasifikasi_Kulit_Wajah_iOS.ipa
